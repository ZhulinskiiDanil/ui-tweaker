name: Build

# Every push gets a .geode in the run's artifacts, a published release gets it attached

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The math without Geode in it, with GCC
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run the tests
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  # The same with MSVC
  tests-windows:
    name: Tests on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run the tests
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests --config Release
          ctest --test-dir build-tests -C Release --output-on-failure

  # The code the mod generates, every kind of it, compiled against the real Geode headers (tools/codecheck.sh)
  codecheck:
    name: Generated code against Geode
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate the code
        shell: bash
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests --config Release --target generate-samples
          ./build-tests/Release/generate-samples.exe build-tests/samples.inc build-tests/hooks.inc tests/geode/real.inc

      - name: Compile it in a mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          path: tests/geode

  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.build-output }}"/*.geode --clobber --repo "${{ github.repository }}"
